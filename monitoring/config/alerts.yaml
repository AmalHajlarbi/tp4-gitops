apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tp4-alerts
spec:
  groups:
    - name: tp4.gitops
      rules:
        - alert: ArgoAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Application ArgoCD {{ $labels.name }} Degraded depuis plus de 2 min"
        - alert: ArgoAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Application ArgoCD {{ $labels.name }} OutOfSync depuis plus de 2 min"
        - alert: PodImagePullOrCrash
          expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CrashLoopBackOff"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} bloqué ({{ $labels.reason }})"
